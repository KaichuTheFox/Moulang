name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $source = Get-Content -Raw CMakeLists.txt
          if ($source -notmatch 'project\(Moulang VERSION ([0-9]+\.[0-9]+\.[0-9]+)') { throw 'Missing compiler version' }
          if ($env:RELEASE_TAG -cne ('v' + $Matches[1])) { throw 'Tag does not match the compiler version' }
      - name: Install verified LLVM 22.1.8 toolchains
        run: ./tools/Install-Toolchains.ps1
      - name: Configure, build, and run CTest
        run: ./tools/Build-Windows.ps1 -BuildDirectory build/windows-release
      - name: Install extension development dependencies
        working-directory: vscode-extension
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test extension lookup, settings action, and TextMate escapes
        working-directory: vscode-extension
        run: npm run test:unit
      - name: Check repository metadata and documentation links
        run: node --test tests/docs/repository-links.test.js
      - name: Test source and VSIX in downloaded isolated VS Code
        working-directory: vscode-extension
        env:
          MOULANG_TEST_COMPILER: ${{ github.workspace }}/build/windows-release/bin/moulang.exe
        run: npm test
      - name: Package compiler, static kit, notices, and VSIX
        run: ./tools/Package-Windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moulang-windows-x64
          path: |
            build/release/moulang-windows-x64.zip
            build/release/moulang-windows-x64.zip.sha256
          if-no-files-found: error

  installation-verification:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: moulang-windows-x64
          path: incoming
      - name: Verify ZIP and run installed Hello World
        shell: pwsh
        run: |
          $zip = 'incoming/moulang-windows-x64.zip'
          $expected = ((Get-Content -Raw ($zip + '.sha256')) -split '\s+')[0]
          if ($expected -notmatch '^[a-f0-9]{64}$' -or (Get-FileHash $zip -Algorithm SHA256).Hash -ine $expected) { throw 'ZIP checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath installed
          ./installed/Verify-Install.ps1 -Root (Resolve-Path installed).Path

  release:
    needs: [build, installation-verification]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: moulang-windows-x64
          path: release-assets
      - name: Publish the verified tag assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG --verify-tag --title ('Moulang ' + $env:RELEASE_TAG) --notes 'Windows 10/11 x64 static package. Hosted installation checks restrict tool discovery; separate clean-Windows validation remains required.' release-assets/moulang-windows-x64.zip release-assets/moulang-windows-x64.zip.sha256
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
